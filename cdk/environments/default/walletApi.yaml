apiStageName: v1
applicationLogLevel: INFO
canaryEnabled: false
cardTtlDays: 7
certificateSecretName: /apple-wallet-customer-card/{environment}/certificates
logRetentionDays: 7
minify: false
removalPolicy: destroy
secretsCacheTtlSeconds: 300
secretsExtensionLayerParameterName: /aws/service/aws-parameters-and-secrets-lambda-extension/arm64/latest
throttlingBurstLimit: 5
throttlingRateLimit: 2
