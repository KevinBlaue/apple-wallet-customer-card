name: Pull request deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: wallet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PR environment (opt-in)
    if: >-
      ${{ vars.ENABLE_AWS_DEPLOYMENT == 'true' &&
          vars.AWS_DEV_DEPLOY_ROLE_ARN != '' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      deploy_role_arn: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
      environment: pr-${{ github.event.pull_request.number }}
