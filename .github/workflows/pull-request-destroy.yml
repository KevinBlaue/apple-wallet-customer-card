name: Pull request cleanup

on:
  pull_request:
    types: [closed]

jobs:
  destroy:
    name: Destroy PR environment (opt-in)
    if: >-
      ${{ vars.ENABLE_AWS_DEPLOYMENT == 'true' &&
          vars.AWS_DEV_DEPLOY_ROLE_ARN != '' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-destroy.yml
    with:
      aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      deploy_role_arn: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
      environment: pr-${{ github.event.pull_request.number }}
