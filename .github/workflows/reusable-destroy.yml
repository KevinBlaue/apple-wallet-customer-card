name: Reusable destroy

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region containing the environment
        required: true
        type: string
      deploy_role_arn:
        description: GitHub OIDC role assumed for cleanup
        required: true
        type: string
      environment:
        description: Environment namespace to destroy
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.deploy_role_arn }}

      - name: Destroy environment stacks
        run: >-
          npm run cdk -- destroy
          -c environment=${{ inputs.environment }}
          "${{ inputs.environment }}-*"
          --force
